# A code field takes an object only where the YAML compiler turns it into code. Here it doesn't, so
# Core rejects the object; the schema accepts it.
cubes:
  - name: orders
    sql_table: orders
    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true

view_groups:
  - name: nested_group_includes
    includes:
      - name: inner
        includes:
          a: 1
