cubes:
  - name: conditional_date_masking_test
    sql_table: public.line_items

    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true

      - name: created_at
        sql: created_at
        type: time

      - name: price
        sql: price
        type: number
        mask: -1

      # A number dimension over a text column: the database orders its bounds as text, so a
      # narrower numeric bound lifts the mask on rows the policy hides. This is a data model
      # error, not a masking bug: Cube trusts `type: number` and can't see the column type.
      - name: price_text
        sql: "CAST(price AS TEXT)"
        type: number

    measures:
      - name: count
        type: count

      - name: total_price
        sql: price
        type: sum

      - name: total_price_prev_month
        multi_stage: true
        sql: "{total_price}"
        type: number
        time_shift:
          - time_dimension: created_at
            interval: 1 month
            type: prior

      - name: total_price_all_time
        multi_stage: true
        sql: "{total_price}"
        type: sum
        filter:
          exclude:
            - conditional_date_masking_test.created_at

      - name: total_price_keep_only_id
        multi_stage: true
        sql: "{total_price}"
        type: sum
        filter:
          keep_only:
            - conditional_date_masking_test.id

    access_policy:
      - group: "*"
        member_level:
          includes: []
        member_masking:
          includes: "*"

      - group: "conditional_date_mask_group"
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: created_at
              operator: inDateRange
              values:
                - "2018-02-01"
                - "2018-03-31"

      - group: "conditional_not_in_date_mask_group"
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: created_at
              operator: notInDateRange
              values:
                - "2018-02-01"
                - "2018-03-31"

      - group: "conditional_text_number_mask_group"
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: price_text
              operator: gt
              values:
                - "20"
