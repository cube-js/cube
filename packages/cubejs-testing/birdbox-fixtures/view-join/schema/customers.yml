# Shared dimension cube. Every view below exposes `city` (and `created_at`)
# through its own join path, so a SQL API join of two views on it resolves to
# the same underlying member on both sides.
#
#   Austin  customers 1, 2  ages 20, 40  created 2024-01-01
#   Boston  customer  3     age  50      created 2024-01-02
#   Chicago customer  4     age  60      created 2024-01-03
#   Denver  customer  5     age  35      created 2024-01-03
cubes:
  - name: customers
    sql: >
      SELECT 1 AS id, 'Austin' AS city, 20 AS age, TIMESTAMP '2024-01-01 10:00:00' AS created_at UNION ALL
      SELECT 2 AS id, 'Austin' AS city, 40 AS age, TIMESTAMP '2024-01-01 12:00:00' AS created_at UNION ALL
      SELECT 3 AS id, 'Boston' AS city, 50 AS age, TIMESTAMP '2024-01-02 10:00:00' AS created_at UNION ALL
      SELECT 4 AS id, 'Chicago' AS city, 60 AS age, TIMESTAMP '2024-01-03 10:00:00' AS created_at UNION ALL
      SELECT 5 AS id, 'Denver' AS city, 35 AS age, TIMESTAMP '2024-01-03 12:00:00' AS created_at

    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true

      - name: city
        sql: city
        type: string

      - name: created_at
        sql: created_at
        type: time

    measures:
      - name: avg_age
        sql: age
        type: avg
