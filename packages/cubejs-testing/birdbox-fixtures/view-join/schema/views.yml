# One view per fact, each exposing the shared customers.city and
# customers.created_at members under the same names, so
# `JOIN ... ON a.customer_city = b.customer_city` joins two views on a single
# underlying cube member.
views:
  - name: orders_view
    cubes:
      - join_path: orders
        includes:
          - revenue
      - join_path: customers
        includes:
          - name: city
            alias: customer_city
          - created_at

  - name: returns_view
    cubes:
      - join_path: returns
        includes:
          - refunds
      - join_path: customers
        includes:
          - name: city
            alias: customer_city
          - created_at

  - name: payments_view
    cubes:
      - join_path: payments
        includes:
          - paid
      - join_path: customers
        includes:
          - name: city
            alias: customer_city
