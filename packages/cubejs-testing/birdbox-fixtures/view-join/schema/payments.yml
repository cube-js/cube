# Austin 120, Boston 70, Denver 20: the only fact with a Denver row.
cubes:
  - name: payments
    sql: >
      SELECT 1 AS id, 1 AS customer_id, 120 AS amount UNION ALL
      SELECT 2 AS id, 3 AS customer_id, 70 AS amount UNION ALL
      SELECT 3 AS id, 5 AS customer_id, 20 AS amount

    joins:
      - name: customers
        sql: "{CUBE}.customer_id = {customers}.id"
        relationship: many_to_one

    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true

    measures:
      - name: paid
        sql: amount
        type: sum
