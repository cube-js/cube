cubes:
    - name: orders
      sql: "SELECT * FROM case_switch_orders"
      joins:
          - name: refunds
            relationship: one_to_one
            sql: "{orders}.id = {refunds.id}"
      dimensions:
          - name: id
            type: number
            sql: id
            primary_key: true
          - name: status
            type: string
            sql: status
          - name: currency_selector
            type: switch
            values:
                - USD
                - EUR
                - NOK
          - name: currency_label
            type: string
            sql: "'cur_' || {CUBE.currency_selector}"
      measures:
          - name: amount_usd
            type: sum
            sql: amount_usd
          - name: amount_eur
            type: sum
            sql: amount_eur
          - name: amount_nok
            type: sum
            sql: amount_nok
          # Every switch value has its own `when`, so `else` is reachable only
          # when the switch dimension is absent from the query.
          - name: dynamic_amount
            type: number
            multi_stage: true
            case:
                switch: "{CUBE.currency_selector}"
                when:
                    - value: EUR
                      sql: "{CUBE.amount_eur}"
                    - value: NOK
                      sql: "{CUBE.amount_nok}"
                    - value: USD
                      sql: "{CUBE.amount_usd}"
                else:
                    sql: "{CUBE.amount_usd}"
          - name: amount_total
            type: sum
            sql: "amount_usd + amount_eur"
          # `else` points at members no `when` uses.
          - name: dynamic_amount_disjoint_else
            type: number
            multi_stage: true
            case:
                switch: "{CUBE.currency_selector}"
                when:
                    - value: EUR
                      sql: "{CUBE.amount_eur}"
                    - value: NOK
                      sql: "{CUBE.amount_nok}"
                    - value: USD
                      sql: "{CUBE.amount_usd}"
                else:
                    sql: "{CUBE.amount_total}"
          - name: dynamic_amount_joined_else
            type: number
            multi_stage: true
            case:
                switch: "{CUBE.currency_selector}"
                when:
                    - value: EUR
                      sql: "{CUBE.amount_eur}"
                    - value: NOK
                      sql: "{CUBE.amount_nok}"
                    - value: USD
                      sql: "{CUBE.amount_usd}"
                else:
                    sql: "{refunds.refund_eur}"
          - name: dynamic_amount_open_else
            type: number
            multi_stage: true
            case:
                switch: "{CUBE.currency_selector}"
                when:
                    - value: EUR
                      sql: "{CUBE.amount_eur}"
                    - value: NOK
                      sql: "{CUBE.amount_nok}"
                else:
                    sql: "{CUBE.amount_usd}"
          - name: dynamic_amount_doubled
            type: number
            sql: "{CUBE.dynamic_amount} * 2"
    # Its own switch dimension: a filter on `orders.currency_selector` does
    # not pin it.
    - name: refunds
      sql: "SELECT * FROM case_switch_orders"
      dimensions:
          - name: id
            type: number
            sql: id
            primary_key: true
          - name: currency_selector
            type: switch
            values:
                - USD
                - EUR
      measures:
          - name: refund_usd
            type: sum
            sql: amount_usd
          - name: refund_eur
            type: sum
            sql: amount_eur
          - name: dynamic_refund
            type: number
            multi_stage: true
            case:
                switch: "{CUBE.currency_selector}"
                when:
                    - value: EUR
                      sql: "{CUBE.refund_eur}"
                else:
                    sql: "{CUBE.refund_usd}"
views:
    - name: orders_view
      cubes:
          - join_path: orders
            includes: "*"
