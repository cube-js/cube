cubes:
    - name: source_a
      sql: "SELECT * FROM calc_groups_source_a"
      dimensions:
          - name: pk
            type: number
            sql: id
            primary_key: true
          - name: product_category
            type: string
            sql: product_category
          - name: created_at
            type: time
            sql: created_at
      measures:
          - name: count
            type: count
          - name: price_usd
            type: sum
            sql: price_usd
          - name: price_eur
            type: sum
            sql: price_eur

    - name: source_b
      sql: "SELECT * FROM calc_groups_source_b"
      dimensions:
          - name: pk
            type: number
            sql: id
            primary_key: true
          - name: product_category
            type: string
            sql: product_category
          - name: created_at
            type: time
            sql: created_at
      measures:
          - name: count
            type: count
          - name: price_usd
            type: sum
            sql: price_usd
          - name: price_eur
            type: sum
            sql: price_eur

views:
    - name: source
      cubes: []
      dimensions:
          - name: source
            type: switch
            values: ["A", "B"]

          - name: currency
            type: switch
            values: ["USD", "EUR"]

          - name: product_category
            type: string
            multi_stage: true
            case:
              switch: "{CUBE.source}"
              when:
                - value: A
                  sql: "{source_a.product_category}"
                - value: B
                  sql: "{source_b.product_category}"
              else:
                sql: "{source_a.product_category}"

          - name: product_category_ext
            type: string
            multi_stage: true
            case:
              switch: "{CUBE.currency}"
              when:
                - value: USD
                  sql: "CONCAT({source.product_category}, '-', 'USD', '-', {source.currency})"
                - value: EUR
                  sql: "CONCAT({source.product_category}, '-', 'EUR', '-', {source.currency})"
              else:
                sql: "''"

      measures:
          - name: price_usd
            type: sum
            multi_stage: true
            case:
              switch: "{CUBE.source}"
              when:
                - value: A
                  sql: "{source_a.price_usd}"
                - value: B
                  sql: "{source_b.price_usd}"
              else:
                sql: "{source_a.price_usd}"

          - name: price_eur
            type: sum
            multi_stage: true
            case:
              switch: "{CUBE.source}"
              when:
                - value: A
                  sql: "{source_a.price_eur}"
                - value: B
                  sql: "{source_b.price_eur}"
              else:
                sql: "{source_a.price_eur}"

          - name: price
            type: sum
            multi_stage: true
            case:
              switch: "{CUBE.currency}"
              when:
                - value: USD
                  sql: "{CUBE.price_usd}"
                - value: EUR
                  sql: "{CUBE.price_eur}"
              else:
                sql: "{CUBE.price_usd}"
