cubes:
    - name: regions
      sql: "SELECT * FROM regions"
      dimensions:
          - name: id
            type: number
            sql: id
            primary_key: true
          - name: name
            type: string
            sql: name

    - name: customers
      sql: "SELECT * FROM customers"
      joins:
          - name: orders
            relationship: one_to_many
            sql: "{customers}.id = {orders.customer_id}"
          - name: returns
            relationship: one_to_many
            sql: "{customers}.id = {returns.customer_id}"
          - name: reviews
            relationship: one_to_many
            sql: "{customers}.id = {reviews.customer_id}"
          - name: regions
            relationship: many_to_one
            sql: "{customers}.region_id = {regions.id}"
      dimensions:
          - name: id
            type: number
            sql: id
            primary_key: true
          - name: name
            type: string
            sql: name
          - name: city
            type: string
            sql: city
          - name: lifetime_value
            type: number
            sql: lifetime_value
          - name: created_at
            type: time
            sql: created_at
          - name: order_total
            type: number
            sql: "{orders.total_amount}"
            sub_query: true
      measures:
          - name: count
            type: count
          - name: total_order_total
            type: sum
            sql: "{order_total}"
          - name: total_lifetime_value
            type: sum
            sql: lifetime_value
          - name: total_lifetime_value_for_east
            type: sum
            sql: lifetime_value
            filters:
              - sql: "{regions.name} = 'East'"
          - name: active_count
            type: count
            sql: "{id}"
            filters:
              - sql: "{name} LIKE 'A%'"

    - name: orders
      sql: "SELECT * FROM orders"
      dimensions:
          - name: id
            type: number
            sql: id
            primary_key: true
          - name: customer_id
            type: number
            sql: customer_id
          - name: status
            type: string
            sql: status
          - name: created_at
            type: time
            sql: created_at
      measures:
          - name: count
            type: count
          - name: total_amount
            type: sum
            sql: amount
          - name: unique_customers
            type: count_distinct
            sql: customer_id
          - name: avg_amount_per_return
            type: number
            sql: "{orders.total_amount} / NULLIF({returns.count}, 0)"
          - name: customer_lifetime_per_order
            type: sum
            sql: "{customers.lifetime_value}"
          - name: amount_minus_refund
            type: number
            sql: "{orders.total_amount} - {returns.total_refund}"
          - name: amount_per_customer
            type: number
            sql: "{orders.total_amount} / NULLIF({customers.count}, 0)"
          - name: lifetime_minus_refund
            type: number
            sql: "{orders.customer_lifetime_per_order} - {returns.total_refund}"
          - name: avg_amount
            type: number
            sql: "{orders.total_amount} / NULLIF({orders.count}, 0)"
          - name: amount_minus_refund_per_customer
            type: number
            sql: "({orders.total_amount} - {returns.total_refund}) / NULLIF({customers.count}, 0)"
          - name: count_minus_returns
            type: number
            sql: "{orders.count} - {returns.count}"
          - name: unique_customers_minus_returning
            type: number
            sql: "{orders.unique_customers} - {returns.unique_customers}"
      segments:
          - name: completed_orders
            sql: "{CUBE}.status = 'completed'"

    - name: returns
      sql: "SELECT * FROM returns"
      dimensions:
          - name: id
            type: number
            sql: id
            primary_key: true
          - name: customer_id
            type: number
            sql: customer_id
          - name: reason
            type: string
            sql: reason
          - name: created_at
            type: time
            sql: created_at
      measures:
          - name: count
            type: count
          - name: total_refund
            type: sum
            sql: refund_amount
          - name: refund_share_of_orders
            type: number
            sql: "{returns.total_refund} / NULLIF({customers.total_order_total}, 0)"
          - name: unique_customers
            type: count_distinct
            sql: customer_id

    - name: reviews
      sql: "SELECT * FROM reviews"
      dimensions:
          - name: id
            type: number
            sql: id
            primary_key: true
          - name: customer_id
            type: number
            sql: customer_id
          - name: rating
            type: number
            sql: rating
          - name: created_at
            type: time
            sql: created_at
      measures:
          - name: count
            type: count
          - name: avg_rating
            type: avg
            sql: rating
