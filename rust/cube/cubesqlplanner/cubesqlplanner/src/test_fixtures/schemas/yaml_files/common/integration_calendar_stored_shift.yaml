cubes:
  - name: retail_calendar
    calendar: true
    sql_table: cal_ss_dates

    dimensions:
      - name: date_val
        sql: "{CUBE}.date_val"
        type: time
        primary_key: true
        granularities:
          - name: week
            sql: "{CUBE}.retail_week_begin"
          - name: year
            sql: "{CUBE}.retail_year_begin"
        time_shift:
          - interval: 1 year
            type: prior
            sql: "{CUBE}.prev_year_date"
          - name: prior_year
            sql: "{CUBE}.prev_year_date"

      - name: retail_date
        sql: "{CUBE}.date_val"
        type: time
        granularities:
          - name: week
            sql: "{CUBE}.retail_week_begin"
          - name: year
            sql: "{CUBE}.retail_year_begin"
        time_shift:
          - interval: 1 year
            type: prior
            sql: "{CUBE}.prev_year_date"
          - interval: 2 year
            type: prior
            sql: "{CUBE}.prev_year_date - interval '1 year'"
          - name: prior_year
            sql: "{CUBE}.prev_year_date"

      # Declares the same named shift as `retail_date` over another mapping.
      - name: retail_date_alt
        sql: "{CUBE}.date_val"
        type: time
        time_shift:
          - name: prior_year
            sql: "{CUBE}.date_val - interval '1 year'"

      # Agrees with `retail_date` on one year back, not on two.
      - name: retail_date_alt2
        sql: "{CUBE}.date_val"
        type: time
        time_shift:
          - interval: 1 year
            type: prior
            sql: "{CUBE}.prev_year_date"
          - interval: 2 year
            type: prior
            sql: "{CUBE}.date_val - interval '2 year'"

      - name: retail_year
        sql: "{CUBE}.retail_year"
        type: string

  - name: sales
    sql_table: cal_ss_sales

    joins:
      - name: retail_calendar
        sql: "{CUBE}.sale_date = {retail_calendar.date_val}"
        relationship: many_to_one

    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true

      - name: store
        sql: store
        type: string

      - name: sale_date
        sql: sale_date
        type: time

    measures:
      - name: amount
        type: sum
        sql: amount

      - name: max_amount
        type: max
        sql: amount

      - name: amount_ly_named
        type: number
        multi_stage: true
        sql: "{amount}"
        time_shift:
          - name: prior_year

      - name: amount_ly_doubled
        type: number
        multi_stage: true
        sql: "{amount} * 2"
        time_shift:
          - name: prior_year

      # Plain interval shifts over a time dimension of the fact itself.
      - name: amount_prev_year
        type: sum
        multi_stage: true
        sql: "{amount}"
        time_shift:
          - time_dimension: sale_date
            interval: 1 year
            type: prior

      - name: max_amount_prev_month
        type: max
        multi_stage: true
        sql: "{max_amount}"
        time_shift:
          - time_dimension: sale_date
            interval: 1 month
            type: prior

      # `type: number` proxies roll up by the kind of the measure they read.
      - name: max_amount_prev_year
        type: number
        multi_stage: true
        sql: "{max_amount}"
        time_shift:
          - time_dimension: sale_date
            interval: 1 year
            type: prior

      - name: approx_stores
        type: count_distinct_approx
        sql: store

      - name: approx_stores_prev_year
        type: number
        multi_stage: true
        sql: "{approx_stores}"
        time_shift:
          - time_dimension: sale_date
            interval: 1 year
            type: prior

      - name: amount_ly
        type: number
        multi_stage: true
        sql: "{amount}"
        time_shift:
          - interval: 1 year
            type: prior

      # A proxy of a proxy: the planner composes both shifts into two years.
      - name: amount_2ly
        type: number
        multi_stage: true
        sql: "{amount_ly}"
        time_shift:
          - interval: 1 year
            type: prior

    pre_aggregations:
      # Stores the shifted measure itself, so its build runs the shifted join.
      - name: sales_ly_by_week
        type: rollup
        measures:
          - amount
          - amount_ly
        dimensions:
          - store
        time_dimension: retail_calendar.retail_date
        granularity: week

      - name: sales_ly_by_year
        type: rollup
        measures:
          - amount
          - amount_ly
        dimensions:
          - store
        time_dimension: retail_calendar.retail_date
        granularity: year

      # Also stores a calendar attribute a query can filter by.
      - name: sales_ly_by_week_and_year
        type: rollup
        measures:
          - amount
          - amount_ly
        dimensions:
          - store
          - retail_calendar.retail_year
        time_dimension: retail_calendar.retail_date
        granularity: week

      # Retail weeks start on Sunday, so a range can only be served from them
      # with the model opting into non-strict matching.
      - name: sales_ly_by_week_non_strict
        type: rollup
        allow_non_strict_date_range_match: true
        measures:
          - amount
          - amount_ly
        dimensions:
          - store
        time_dimension: retail_calendar.retail_date
        granularity: week

      # Only the unshifted measure: the shift cannot be applied on top of it.
      - name: sales_by_week
        type: rollup
        measures:
          - amount
        dimensions:
          - store
        time_dimension: retail_calendar.retail_date
        granularity: week

      - name: sales_ly_named_by_week
        type: rollup
        measures:
          - amount
          - amount_ly_named
        dimensions:
          - store
        time_dimension: retail_calendar.retail_date
        granularity: week

      # The build lands the named shift on `retail_date_alt` too.
      - name: sales_ly_named_by_week_with_alt
        type: rollup
        measures:
          - amount
          - amount_ly_named
        dimensions:
          - store
          - retail_calendar.retail_date_alt
        time_dimension: retail_calendar.retail_date
        granularity: week

      - name: sales_ly_doubled_by_week
        type: rollup
        measures:
          - amount
          - amount_ly_doubled
        dimensions:
          - store
        time_dimension: retail_calendar.retail_date
        granularity: week

      - name: sales_prev_year_by_day
        type: rollup
        measures:
          - amount
          - max_amount
          - amount_prev_year
          - max_amount_prev_month
          - max_amount_prev_year
          - approx_stores
          - approx_stores_prev_year
        dimensions:
          - store
        time_dimension: sale_date
        granularity: day

      # The build lands the composed shift on `retail_date_alt2` too.
      - name: sales_2ly_by_week_with_alt2
        type: rollup
        measures:
          - amount
          - amount_2ly
        dimensions:
          - store
          - retail_calendar.retail_date_alt2
        time_dimension: retail_calendar.retail_date
        granularity: week

      # Built for 2005-2006 only: a stored row's prior-year value comes from
      # the year before its label, so the build reaches back to 2004.
      - name: sales_prev_year_by_day_ranged
        type: rollup
        measures:
          - amount
          - amount_prev_year
        dimensions:
          - store
        time_dimension: sale_date
        granularity: day
        build_range_start: "SELECT TIMESTAMP '2005-01-01'"
        build_range_end: "SELECT TIMESTAMP '2006-12-31 23:59:59.999'"
