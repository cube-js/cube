# The time-dimension join key of `rollup_join_time_dimension_key.yaml` with one leg storing the
# key at two granularities, in two separate columns. Nothing says which of them the join is on.
cubes:
  - name: td_facts
    sql: "SELECT 1 as id, '2026-01-01'::timestamp as day, 10 as amount"

    dimensions:
      - name: id
        type: number
        sql: id
        primary_key: true
      - name: day
        type: time
        sql: day
    measures:
      - name: total_amount
        type: sum
        sql: amount
    pre_aggregations:
      - name: td_facts_rollup
        type: rollup
        measures:
          - total_amount
        time_dimension: day
        granularity: day

  - name: td_dates
    sql: "SELECT '2026-01-01'::timestamp as day, 'Q1' as quarter_label"

    joins:
      - name: td_facts
        relationship: one_to_many
        sql: "{CUBE.day} = {td_facts.day}"
    dimensions:
      - name: day
        type: time
        sql: day
        primary_key: true
      - name: quarter_label
        type: string
        sql: quarter_label
    measures:
      - name: count
        type: count
        sql: "COUNT(*)"
    pre_aggregations:
      - name: td_dates_rollup
        type: rollup
        dimensions:
          - quarter_label
        time_dimensions:
          - dimension: day
            granularity: day
          - dimension: day
            granularity: month
      - name: td_rollup_join
        type: rollupJoin
        measures:
          - td_facts.total_amount
        dimensions:
          - quarter_label
        time_dimension: td_facts.day
        granularity: day
        rollups:
          - td_dates.td_dates_rollup
          - td_facts.td_facts_rollup
