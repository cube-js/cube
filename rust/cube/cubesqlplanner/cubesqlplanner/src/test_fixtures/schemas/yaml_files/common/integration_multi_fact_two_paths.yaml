cubes:
    - name: regions
      sql: "SELECT * FROM regions"
      dimensions:
          - name: id
            type: number
            sql: id
            primary_key: true
          - name: name
            type: string
            sql: name

    - name: customers
      sql: "SELECT * FROM customers"
      joins:
          - name: orders
            relationship: one_to_many
            sql: "{customers}.id = {orders}.customer_id"
          - name: returns
            relationship: one_to_many
            sql: "{customers}.id = {returns}.customer_id"
          - name: regions
            relationship: many_to_one
            sql: "{customers}.region_id = {regions.id}"
      dimensions:
          - name: id
            type: number
            sql: id
            primary_key: true
          - name: city
            type: string
            sql: city

    - name: orders
      sql: "SELECT * FROM orders"
      dimensions:
          - name: id
            type: number
            sql: id
            primary_key: true
      measures:
          - name: total_amount
            type: sum
            sql: amount
          - name: amount_minus_refund
            type: number
            sql: "{orders.total_amount} - {returns.total_refund}"

    - name: returns
      sql: "SELECT * FROM returns"
      joins:
          - name: customers
            relationship: many_to_one
            sql: "{returns}.customer_id = {customers.id}"
          - name: regions
            relationship: many_to_one
            sql: "{returns}.customer_id = {regions.id}"
      dimensions:
          - name: id
            type: number
            sql: id
            primary_key: true
      measures:
          - name: total_refund
            type: sum
            sql: refund_amount
          - name: refund_minus_amount
            type: number
            sql: "{returns.total_refund} - {orders.total_amount}"
