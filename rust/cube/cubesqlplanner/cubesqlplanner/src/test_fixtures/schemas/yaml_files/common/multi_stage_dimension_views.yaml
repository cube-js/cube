cubes:
  - name: activity
    sql: "SELECT * FROM activity"
    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true
      - name: player
        sql: player
        type: string
      - name: tier_subquery_dim
        sql: "{tier}"
        type: string
        sub_query: true
      - name: tier_ms_dim
        sql: "{tier}"
        type: string
        multi_stage: true
    measures:
      - name: theo_win
        sql: theowin
        type: sum
      - name: tier
        sql: "CASE WHEN {theo_win} < 25 THEN 'low' ELSE 'high' END"
        type: string
        multi_stage: true

views:
  - name: activity_view
    cubes:
      - join_path: activity
        includes: "*"
  - name: activity_prefixed_view
    cubes:
      - join_path: activity
        includes: "*"
        prefix: true
