# One fact with two date roles (purchase and cancel date) joined to a shared
# calendar through join aliases, and a fact joined to it directly. The view
# maps the calendar dimensions for the measures of each role.
cubes:
  - name: calendar
    sql_table: vdo_calendar
    dimensions:
      - name: dt_ts
        type: time
        sql: dt_ts
        primary_key: true
      - name: dt_year
        type: string
        sql: dt_year
      - name: dt_year_month
        type: string
        sql: dt_year_month
      - name: dt_quarter
        type: string
        sql: "dt_year || '-Q' || extract(quarter from dt_ts)"
      - name: dt_year_hidden
        type: string
        sql: dt_year
        mask: hidden

  - name: subscriptions
    sql_table: vdo_subscriptions
    joins:
      - name: calendar
        alias: purchase_cal
        sql: "{CUBE}.purchase_date = {purchase_cal.dt_ts}"
        relationship: many_to_one
      - name: calendar
        alias: cancel_cal
        sql: "{CUBE}.cancel_date = {cancel_cal.dt_ts}"
        relationship: many_to_one
    dimensions:
      - name: id
        type: number
        sql: id
        primary_key: true
      - name: plan
        type: string
        sql: plan
    measures:
      - name: count
        type: count
      - name: cancellations
        type: count
        filters:
          - sql: "{CUBE}.cancel_date IS NOT NULL"
      - name: cancellations_cumulative
        type: count
        filters:
          - sql: "{CUBE}.cancel_date IS NOT NULL"
        rolling_window:
          trailing: unbounded
      - name: cancellations_year_to_date
        type: count
        filters:
          - sql: "{CUBE}.cancel_date IS NOT NULL"
        rolling_window:
          type: to_date
          granularity: year
      - name: cancellations_prev_year
        type: number
        multi_stage: true
        sql: "{CUBE.cancellations}"
        time_shift:
          - interval: 1 year
            type: prior
      - name: cancellations_prev_year_by_cancel_date
        type: number
        multi_stage: true
        sql: "{CUBE.cancellations}"
        time_shift:
          - interval: 1 year
            type: prior
            timeDimension: subscriptions.cancel_cal.dt_ts
      - name: count_per_year
        type: sum
        multi_stage: true
        sql: "{CUBE.count}"
        grain:
          exclude:
            - subscriptions.purchase_cal.dt_year_month

  - name: carts
    sql_table: vdo_carts
    joins:
      - name: calendar
        sql: "{CUBE}.created_date = {calendar.dt_ts}"
        relationship: many_to_one
    dimensions:
      - name: id
        type: number
        sql: id
        primary_key: true
      - name: created_year
        type: string
        sql: "to_char(created_date, 'YYYY')"
    measures:
      - name: count
        type: count
      - name: count_all_years
        type: sum
        multi_stage: true
        sql: "{CUBE.count}"
        filter:
          exclude:
            - calendar.dt_year
      - name: count_cumulative
        type: count
        rolling_window:
          trailing: unbounded

views:
  - name: biz
    measures:
      - name: cancellations_per_purchase
        type: number
        multi_stage: true
        sql: "{cancellations_cancellations} * 1.0 / NULLIF({purchases_count}, 0)"
      - name: cancellations_per_purchase_single_stage
        type: number
        sql: "{cancellations_cancellations} * 1.0 / NULLIF({purchases_count}, 0)"
      - name: cumulative_cancellations_per_purchase
        type: number
        sql: "{cancellations_cancellations_cumulative} * 1.0 / NULLIF({purchases_count}, 0)"
      - name: prev_year_cancellations_per_yearly_purchase
        type: number
        sql: "{cancellations_cancellations_prev_year} * 1.0 / NULLIF({purchases_count_per_year}, 0)"
    dimensions:
      - name: dt_label
        type: string
        sql: "'Y' || {dt_year}"
    cubes:
      - join_path: calendar
        includes:
          - dt_ts
          - dt_year
          - dt_year_month
          - dt_quarter
          - dt_year_hidden
      - join_path: subscriptions
        alias: purchases
        prefix: true
        includes:
          - count
          - count_per_year
        dimension_map:
          dt_ts: subscriptions.purchase_cal.dt_ts
          dt_year: subscriptions.purchase_cal.dt_year
          dt_year_month: subscriptions.purchase_cal.dt_year_month
      - join_path: subscriptions
        alias: cancellations
        prefix: true
        includes:
          - count
          - cancellations
          - cancellations_cumulative
          - cancellations_year_to_date
          - cancellations_prev_year
          - cancellations_prev_year_by_cancel_date
        dimension_map:
          dt_ts: subscriptions.cancel_cal.dt_ts
          dt_year: subscriptions.cancel_cal.dt_year
          dt_year_month: subscriptions.cancel_cal.dt_year_month
          dt_year_hidden: subscriptions.cancel_cal.dt_year
      - join_path: subscriptions
        alias: subs
        prefix: true
        includes:
          - plan
      - join_path: carts
        prefix: true
        includes:
          - id
          - count
          - count_cumulative
          - count_all_years
      # The calendar year of a cart, read off its own column.
      - join_path: carts
        alias: carts_own
        prefix: true
        includes:
          - count
          - count_all_years
        dimension_map:
          dt_year: carts.created_year
