cubes:
    - name: daily_activity
      sql: "SELECT * FROM rw_daily_activity"
      dimensions:
          - name: entity_id
            type: string
            sql: entity_id
            primary_key: true
          - name: activity_date
            type: time
            sql: activity_date
      measures:
          - name: events_7d
            type: sum
            sql: events
            rolling_window:
                trailing: 7 day
                offset: start
          - name: minutes_7d
            type: sum
            sql: duration_minutes
            rolling_window:
                trailing: 7 day
                offset: start
      pre_aggregations:
          # One rollup per rolling measure — the `partitionedRolling` shape.
          - name: rolling_events
            measures:
                - events_7d
            dimensions:
                - entity_id
            time_dimension: activity_date
            granularity: day
          - name: rolling_minutes
            measures:
                - minutes_7d
            dimensions:
                - entity_id
            time_dimension: activity_date
            granularity: day
