# view_dimension_overrides_unrelated_facts.yaml with a rollup on each fact, and
# a view measure over a multi-stage measure of one of them.
cubes:
  - name: income
    sql_table: vdo_income
    dimensions:
      - name: id
        type: number
        sql: id
        primary_key: true
      - name: branch
        type: string
        sql: branch
      - name: received_at
        type: time
        sql: received_at
    measures:
      - name: amount
        type: sum
        sql: amount
      - name: amount_total
        type: sum
        multi_stage: true
        sql: "{CUBE.amount}"
        group_by: []
    pre_aggregations:
      - name: by_month_branch
        measures:
          - amount
        dimensions:
          - branch
        time_dimension: received_at
        granularity: month

  - name: expenses
    sql_table: vdo_expenses
    dimensions:
      - name: id
        type: number
        sql: id
        primary_key: true
      - name: branch
        type: string
        sql: branch
      - name: spent_at
        type: time
        sql: spent_at
    measures:
      - name: amount
        type: sum
        sql: amount
    pre_aggregations:
      - name: by_month_branch
        measures:
          - amount
        dimensions:
          - branch
        time_dimension: spent_at
        granularity: month

views:
  - name: finance
    measures:
      - name: balance
        type: number
        sql: "COALESCE({income}, 0) - COALESCE({expenses}, 0)"
      - name: income_share
        type: number
        sql: "{income} * 1.0 / NULLIF({income_total}, 0)"
    cubes:
      - join_path: income
        includes:
          - name: received_at
            alias: date
          - branch
          - name: amount
            alias: income
          - name: amount_total
            alias: income_total
      - join_path: expenses
        includes:
          - name: amount
            alias: expenses
        dimension_overrides:
          date: expenses.spent_at
          branch: expenses.branch
