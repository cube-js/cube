# Multi-stage measures that are one base measure narrowed to different date
# windows, over a rollup that stores the base measure by day.
cubes:
    - name: orders
      sql: "SELECT * FROM orders"
      dimensions:
          - name: id
            type: number
            sql: id
            primary_key: true
          - name: status
            type: string
            sql: status
          # NULL for orders under 200: a NULL key next to non-NULL ones.
          - name: size
            type: string
            sql: "CASE WHEN amount >= 200 THEN 'big' END"
          - name: created_at
            type: time
            sql: created_at
      measures:
          - name: total_amount
            type: sum
            sql: amount
            mask: -1
          - name: max_amount
            type: max
            sql: amount
          - name: count
            type: count
          - name: distinct_customers
            type: count_distinct_approx
            sql: customer_id

          - name: amount_all_week
            type: number
            multi_stage: true
            sql: "{total_amount}"
            filter:
                include:
                    - member: orders.created_at
                      operator: inDateRange
                      values: ["2025-03-01", "2025-03-08"]
          - name: amount_early_week
            type: number
            multi_stage: true
            sql: "{total_amount}"
            filter:
                include:
                    - member: orders.created_at
                      operator: inDateRange
                      values: ["2025-03-01", "2025-03-03"]
          - name: amount_mid_week
            type: number
            multi_stage: true
            sql: "{total_amount}"
            filter:
                include:
                    - member: orders.created_at
                      operator: inDateRange
                      values: ["2025-03-04", "2025-03-06"]
          - name: max_amount_late_week
            type: number
            multi_stage: true
            sql: "{max_amount}"
            filter:
                include:
                    - member: orders.created_at
                      operator: inDateRange
                      values: ["2025-03-07", "2025-03-08"]
          - name: count_early_week
            type: number
            multi_stage: true
            sql: "{count}"
            filter:
                include:
                    - member: orders.created_at
                      operator: inDateRange
                      values: ["2025-03-01", "2025-03-03"]
          - name: count_all_week
            type: number
            multi_stage: true
            sql: "{count}"
            filter:
                include:
                    - member: orders.created_at
                      operator: inDateRange
                      values: ["2025-03-01", "2025-03-08"]
          - name: count_late_week
            type: number
            multi_stage: true
            sql: "{count}"
            filter:
                include:
                    - member: orders.created_at
                      operator: inDateRange
                      values: ["2025-03-07", "2025-03-08"]
          # Same window as amount_early_week, but narrowed to one status too.
          - name: completed_amount_early_week
            type: number
            multi_stage: true
            sql: "{total_amount}"
            filter:
                include:
                    - member: orders.created_at
                      operator: inDateRange
                      values: ["2025-03-01", "2025-03-03"]
                    - member: orders.status
                      operator: equals
                      values: ["completed"]
          - name: distinct_customers_early_week
            type: number
            multi_stage: true
            sql: "{distinct_customers}"
            filter:
                include:
                    - member: orders.created_at
                      operator: inDateRange
                      values: ["2025-03-01", "2025-03-03"]
          - name: distinct_customers_all_week
            type: number
            multi_stage: true
            sql: "{distinct_customers}"
            filter:
                include:
                    - member: orders.created_at
                      operator: inDateRange
                      values: ["2025-03-01", "2025-03-08"]
          - name: early_week_share
            type: number
            multi_stage: true
            sql: "{amount_early_week} / NULLIF({amount_all_week}, 0)"
      segments:
          - name: big_orders
            sql: "{CUBE}.amount >= 200"
      pre_aggregations:
          - name: orders_by_status_size_day
            type: rollup
            measures:
                - total_amount
                - max_amount
                - count
                - distinct_customers
            dimensions:
                - status
                - size
            segments:
                - big_orders
            time_dimension: created_at
            granularity: day

views:
    - name: orders_view
      cubes:
          - join_path: orders
            includes:
                - status
                - size
                - created_at
                - amount_all_week
                - amount_early_week
                - amount_mid_week
                - max_amount_late_week
