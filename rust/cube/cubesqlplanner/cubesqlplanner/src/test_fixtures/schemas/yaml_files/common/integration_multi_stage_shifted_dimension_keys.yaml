cubes:
    - name: customers
      sql: "SELECT * FROM mss_customers"
      joins:
          - name: orders
            relationship: one_to_many
            sql: "{CUBE}.id = {orders.customer_id}"
      dimensions:
          - name: id
            type: number
            sql: id
            primary_key: true
          - name: total_spend
            type: number
            sql: "{orders.total_amount}"
            sub_query: true
          - name: monthly_spend
            type: number
            sql: "{orders.total_amount}"
            multi_stage: true
            add_group_by:
                - customers.id

    - name: orders
      sql: "SELECT * FROM mss_orders"
      dimensions:
          - name: id
            type: number
            sql: id
            primary_key: true
          - name: customer_id
            type: number
            sql: customer_id
          - name: created_at
            type: time
            sql: created_at
      measures:
          - name: total_amount
            type: sum
            sql: amount
          - name: amount_prev_month
            type: number
            sql: "{CUBE.total_amount}"
            multi_stage: true
            time_shift:
                - interval: "1 month"
                  type: prior
