# Two facts with no join between them and no shared dimension cube: income and
# expenses, each by its own date and branch. The view relates them: its date
# and branch are the income's, and the expenses override them with their own.
cubes:
  - name: income
    sql_table: vdo_income
    dimensions:
      - name: id
        type: number
        sql: id
        primary_key: true
      - name: branch
        type: string
        sql: branch
      - name: received_at
        type: time
        sql: received_at
    measures:
      - name: amount
        type: sum
        sql: amount

  - name: expenses
    sql_table: vdo_expenses
    dimensions:
      - name: id
        type: number
        sql: id
        primary_key: true
      - name: branch
        type: string
        sql: branch
      - name: spent_at
        type: time
        sql: spent_at
    measures:
      - name: amount
        type: sum
        sql: amount

views:
  - name: finance
    cubes:
      - join_path: income
        includes:
          - name: received_at
            alias: date
          - branch
          - name: amount
            alias: income
      - join_path: expenses
        includes:
          - name: amount
            alias: expenses
        dimension_overrides:
          date: expenses.spent_at
          branch: expenses.branch
