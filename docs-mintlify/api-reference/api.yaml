          report a `publicId` you chose. `PUT /deployments/{deploymentId}/reports/{reportId}`
          accepts `publicId` for exactly this, on any report that does not have one yet (it is
          write-once — a report's existing `publicId` cannot be changed, since clients may already
          have stored it).


          `source` is **create-only**: it is recorded when the report is first created and ignored
          on subsequent updates (it describes where the report originated, not its current
          definition).


          Access: updating requires **edit** access to the existing report; creating requires the
          same access as `POST /reports`.
