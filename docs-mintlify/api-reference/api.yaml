          the portable identity for managing dashboards as code (CI/CD pipelines re-applying the
          same definition against any environment).


          If a workbook with this slug exists in the deployment, it is updated: only the fields you
          send are changed, and `meta` is merged into the existing metadata (a `meta.dashboardDraft`
