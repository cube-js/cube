          `REPORT`, `FOLDER`. Repeated references to the same item are collapsed, so the response
          holds exactly one entry per distinct item requested.


          **This endpoint is partially successful.** It returns `200` whenever the request itself is
          well formed, and reports each item's outcome separately:

          - `deleted` — the `(type, id)` of each item that was deleted.

          - `failed` — the items that were not deleted, each with the `(type, id)` requested and an
          `error` carrying the `status` and `message` the per-type delete endpoint would have
          returned for it (`403` when the caller lacks access, `404` when the item does not exist or
          belongs to another deployment, `400` when a folder still has sub-folders).


