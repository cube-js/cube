          reports that predate stable ids (see below), and it matches more than one of them, so it
          cannot identify a single report. Nothing was changed. This is **permanent**, and the fix
          is different from the case above: assign the report you mean a `publicId` of your own with
          `PUT /deployments/{deploymentId}/reports/{reportId}`, then key on that.


          **Reports created before stable ids** do not store a `publicId`; the API synthesizes one
          for them from the report's internal id. Those synthesized ids are **not unique** — several
          reports can share one, and in practice most do. This endpoint resolves such an id only
          when it is unambiguous, adopting it as the report's real `publicId` at that point;
          otherwise it returns the `ambiguous_legacy_id` conflict above.


