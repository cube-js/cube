  /api/v1/embed/generate-session:
    post:
      operationId: generateSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSession'
        description: GenerateSessionDTO
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateSessionResponse'
          description: ''
      summary: Generate an embed session
      tags:
        - Embed
      x-mint:
        content: >-
          **🔒 Admin only.** Requires administrator privileges — the authenticated principal (API
          key, embed JWT, or any bearer token) must belong to a user with the admin role.


          Creates a one-time embed session for a deployment and returns its `sessionId`.


          The session captures the embed context that will be baked into the embed token once
          redeemed — the target `deploymentId`, the end user's identity (`externalId` / `email` /
          `userProfile`), their group memberships, `userAttributes`, and an optional
          `securityContext`. Exchange the returned `sessionId` for a signed embed JWT via `POST
          /api/v1/embed/session/token` (single use).


          The end user can be assigned to two independent kinds of group, which serve different
          purposes:


          - **`groups`** — global, tenant-wide groups for **data-model access control**. Their names
          are passed verbatim into the Cube security context (`cubeCloud.groups`), where your data
          model's `access_policy` rules use them to gate cubes, views, members, and
          row-/column-level filters. They must already exist in the tenant.

          - **`tenantGroups`** — per-embed-tenant groups for **sharing and organizing content within
          a single embed tenant** (e.g. sharing a workbook or dashboard with a group in Creator
          Mode). Requires `creatorMode: true` and `embedTenantName`; create them inline via
          `tenantGroupDefinitions`. In the security context they are namespaced as
          `system:tenant:{embedTenantName}:group:{group}`, so they never collide with a same-named
          global group.


          See the individual request-body fields for the full contract.


          `deploymentId` is required and the caller must have read access to it. Embedding must be
          enabled for the tenant, otherwise `403` is returned.
