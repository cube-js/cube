          the order given, each in its own transaction, so **deletions are not rolled back** when a
          later item fails — the response is the record of what was applied. Deleting a folder does
          not delete the workbooks, dashboards, and reports directly inside it: they are detached
          and returned to the workspace root, matching `DELETE /folders/:folderId`.


