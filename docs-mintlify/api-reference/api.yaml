openapi: 3.1.0
info:
  title: Cube Platform API
  version: 1.0.0
  description: |-
    Programmatically manage Cube: deployments and everything scoped to them
    (environments, folders, reports, workbooks, notifications, workspace, and agents),
    plus account-level users, groups, policies, embedding, and AI settings. Data-model
    authoring, dev mode, branches, and uploads live under /build/api/v1 — same host and
    token, routed to the build pods.
servers:
  - url: https://{tenant}.cubecloud.dev
    description: Your tenant host. Replace the whole host if you use a custom domain.
    variables:
      tenant:
        default: your-tenant
        description: Your Cube tenant subdomain
security:
  - bearerAuth: []
tags:
  - name: Deployments
  - name: Deployment Creation
  - name: Environments
  - name: Env Variables
  - name: Regions
  - name: Data Model
  - name: Data Model Uploads
  - name: GitHub
  - name: GitHub Connection
  - name: dbt Sync
  - name: Folders
  - name: Reports
  - name: Workbooks
  - name: Notifications
  - name: Workspace
  - name: Users Admin
  - name: User Attributes
  - name: User Attribute Values
  - name: Tenant Settings
  - name: OAuth Integrations
  - name: User OAuth Tokens
  - name: OIDC Token Configs
  - name: App Theme
  - name: Embed
  - name: Embed Tenants
  - name: Dashboard Embed Access
  - name: OpenAPI Spec
paths:
  /api/v1/app-config:
    get:
      operationId: getAppConfig
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfigResponse'
          description: ''
      summary: Get app config
      tags:
        - App Theme
  /api/v1/deployments:
    get:
      operationId: getDeployments
      parameters:
        - in: query
          name: creationStep
          required: false
          schema:
            oneOf:
              - items:
                  enum:
                    - project
                    - upload
                    - schema
                    - github
                    - ssh
                    - databases
                    - ready
                    - demo
                  type: string
                type: array
                $ref: '#/components/schemas/CreationStep'
              - type: array
                items:
                  $ref: '#/components/schemas/CreationStep'
        - in: query
          name: offset
          required: false
          schema:
            oneOf:
              - minimum: 0
                type: integer
              - type: 'null'
            type: integer
            minimum: 0
        - in: query
          name: limit
          required: false
          schema:
            oneOf:
              - minimum: 0
                type: integer
              - type: 'null'
            type: integer
            minimum: 0
        - in: query
          name: first
          required: false
          schema:
            type: integer
            minimum: 1
          description: Page size for cursor-based pagination
        - in: query
          name: after
          required: false
          schema:
            minimum: 1
            type: string
          description: Cursor for fetching the next page
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentsListResponse'
          description: ''
      summary: Get deployments
      tags:
        - Deployments
  /api/v1/deployments/{deploymentId}:
    delete:
      operationId: deleteDeployment
      parameters:
        - in: path
          name: deploymentId
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentDeleteResponse'
          description: ''
      summary: Delete deployment
      tags:
        - Deployments
    get:
      operationId: getDeployment
      parameters:
        - in: path
          name: deploymentId
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
          description: ''
      summary: Get deployment
      tags:
        - Deployments
    put:
      operationId: updateDeployment
      parameters:
        - in: path
          name: deploymentId
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeploymentInput'
        description: UpdateDeploymentInput
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentSettings'
          description: ''
      summary: Update a deployment
      tags:
        - Deployments
      x-mint:
        content: >-
          Update any subset of a deployment’s settings — everything the console’s Settings pages own
          — and read the full settings back. Fields you omit are left alone, and `templateVariables`
          is merged key-by-key rather than replaced, so setting one configuration flag never clears
          the others. `releaseChannelVersion` must be one of the versions `GET
          /:deploymentId/versions` lists for the target channel (in any of the forms it reports) —
          anything else is a 400, and the container image is resolved from the version rather than
          sent. Choosing a version that is not the channel’s latest also sets
          `releaseChannelVersionHold` unless you send it explicitly, so auto-upgrade does not undo
          the pin.
  /api/v1/deployments/{deploymentId}/build-status:
    get:
      operationId: buildStatus
      parameters:
        - in: path
          name: deploymentId
          required: true
          schema:
            type: integer
        - in: query
          name: branchName
          schema:
            oneOf:
              - type: string
              - type: 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildStatusResponse'
          description: ''
      summary: Latest build/compile status for a branch (production build or dev-mode)
      tags:
        - Deployments
  /api/v1/deployments/{deploymentId}/creation-step/advance:
    post:
      operationId: advanceCreationStep
      parameters:
        - in: path
          name: deploymentId
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvanceCreationStepInput'
        description: AdvanceCreationStepInput
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
          description: ''
      summary: Advance a deployment to a given onboarding step (e.g. after connecting a source)
      tags:
        - Deployments
  /api/v1/deployments/{deploymentId}/creation-step/reset:
    post:
      operationId: resetCreationStep
      parameters:
        - in: path
          name: deploymentId
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
          description: ''
      summary: Reset a deployment to the first onboarding step (project)
      tags:
        - Deployments
  /api/v1/deployments/{deploymentId}/dbt-sync:
    post:
      operationId: startDbtSync
      parameters:
        - in: path
          name: deploymentId
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartDbtSyncInput'
        description: StartDbtSyncInput
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbtSyncResponse'
          description: ''
      summary: Start a dbt sync for a deployment
      tags:
        - dbt Sync
  /api/v1/deployments/{deploymentId}/dbt-sync/{syncJobId}:
    delete:
      operationId: cancelDbtSync
      parameters:
        - in: path
          name: deploymentId
          required: true
          schema:
            type: integer
        - in: path
          name: syncJobId
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbtSyncCancelResponse'
          description: ''
      summary: Cancel a running dbt sync
      tags:
        - dbt Sync
    get:
      operationId: getDbtSyncStatus
      parameters:
        - in: path
          name: deploymentId
          required: true
          schema:
            type: integer
        - in: path
          name: syncJobId
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbtSyncStatusResponse'
          description: ''
      summary: Get the status of a dbt sync
      tags:
        - dbt Sync
  /api/v1/deployments/{deploymentId}/dbt-sync/{syncJobId}/result:
    get:
      operationId: getDbtSyncResult
      parameters:
        - in: path
          name: deploymentId
          required: true
          schema:
            type: integer
        - in: path
          name: syncJobId
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbtSyncResultResponse'
          description: ''
      summary: Get the result of a completed dbt sync
      tags:
        - dbt Sync
  /api/v1/deployments/{deploymentId}/env-vars:
    get:
      operationId: getEnvVariables
      parameters:
        - in: path
          name: deploymentId
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvVariablesListResponse'
          description: ''
      summary: Get env variables
      tags:
        - Env Variables
      x-mint:
        content: >-
          Lists the deployment environment variables. Values of secret-named variables (containing
          PASS, SECRET, TOKEN, KEY, or CREDENTIAL) are returned as `[ENCRYPTED]`.
    put:
      operationId: setEnvVariables
      parameters:
        - in: path
          name: deploymentId
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetEnvVariablesInput'
        description: SetEnvVariablesInput
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvVariablesListResponse'
          description: ''
      summary: Set env variables
      tags:
        - Env Variables
      x-mint:
        content: >-
          Upserts deployment environment variables by name; variables not included keep their
          existing values. Passing the `[ENCRYPTED]` placeholder (the masked read value) is rejected
          — omit variables you do not intend to change. New variable names must be POSIX identifiers
          (`^[A-Za-z_][A-Za-z0-9_]*$`); names already stored on the deployment may be resent
          unchanged so a legacy name can still be updated or removed.
  /api/v1/deployments/{deploymentId}/environments:
    get:
      operationId: getDeploymentEnvironments
      parameters:
        - in: path
          name: deploymentId
          required: true
          schema:
            type: integer
        - in: query
          name: type
          required: false
          schema:
            oneOf:
              - $ref: '#/components/schemas/GetDeploymentEnvironmentsQueryType'
              - type: 'null'
            type: string
            enum:
              - production
              - staging
              - development
        - in: query
          name: offset
          required: false
          schema:
            oneOf:
              - minimum: 0
                type: integer
              - type: 'null'
            type: integer
            minimum: 0
        - in: query
          name: limit
          required: false
          schema:
            oneOf:
              - minimum: 0
                type: integer
              - type: 'null'
            type: integer
            minimum: 0
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentEnvironmentsListResponse'
          description: ''
      summary: Get deployment environments
      tags:
        - Environments
  /api/v1/deployments/{deploymentId}/environments/{environmentId}/tokens:
    get:
      operationId: getDeploymentEnvironmentTokens
      parameters:
        - in: path
          name: deploymentId
          required: true
          schema:
            type: integer
        - in: path
          name: environmentId
          required: true
          schema:
            type: integer
        - in: query
          name: offset
          required: false
          schema:
            oneOf:
              - minimum: 0
                type: integer
              - type: 'null'
            type: integer
            minimum: 0
        - in: query
          name: limit
          required: false
          schema:
            oneOf:
              - minimum: 0
                type: integer
              - type: 'null'
            type: integer
            minimum: 0
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentEnvironmentTokensListResponse'
          description: ''
      summary: Get deployment environment tokens
      tags:
        - Environments
    post:
      operationId: createDeploymentEnvironmentToken
      parameters:
        - in: path
          name: deploymentId
          required: true
          schema:
            type: integer
        - in: path
          name: environmentId
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeploymentEnvironmentTokenInput'
        description: CreateDeploymentEnvironmentTokenInput
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentEnvironmentTokenResponse'
          description: ''
      summary: Create deployment environment token
      tags:
        - Environments
  /api/v1/deployments/{deploymentId}/environments/{environmentId}/tokens-for-meta-sync:
    post:
      operationId: createDeploymentEnvironmentTokenForMetaSync
      parameters:
        - in: path
          name: deploymentId
          required: true
          schema:
            type: integer
        - in: path
          name: environmentId
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeploymentEnvironmentTokenInput'
        description: CreateDeploymentEnvironmentTokenInput
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentEnvironmentTokenResponse'
          description: ''
      summary: Create deployment environment token for meta sync
      tags:
        - Environments
  /api/v1/deployments/{deploymentId}/folders:
    get:
      operationId: getFolders
      parameters:
        - in: path
          name: deploymentId
          required: true
          schema:
            type: number
        - in: query
          name: parentId
          schema:
            oneOf:
              - minimum: 0
                type: integer
              - type: 'null'
        - in: query
          name: after
          schema:
            type: string
        - in: query
          name: first
          schema:
            minimum: 1
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoldersListResponse'
          description: ''
      summary: List folders
      tags:
        - Folders
      x-mint:
        content: >-
          List the folders in a deployment's workspace.


          By default this returns the folders at the workspace root. Pass the `parentId` query
          parameter to list the direct children of a specific folder instead.


          Results are scoped to the calling user: only folders the user can see are returned. A
          folder is visible when the user owns it, has been granted access to it directly, or has
          access to something inside it (a sub-folder, workbook, or dashboard), in which case the
          ancestor folders are surfaced as navigation.


          This endpoint is not recursive — it returns a single level of the folder tree per call.
          Use `parentId` to walk deeper, or `GET /folders/{folderId}/ancestors` to resolve a
          breadcrumb path.


          Results are returned in pages using cursor-based pagination: pass `first` to set the page
          size and `after` (the previous response's `pageInfo.endCursor`) to fetch the next page.
          The legacy `data` and `count` fields are still populated for backwards compatibility but
          are deprecated in favour of `items` and `pageInfo`.
    post:
      operationId: createFolder
      parameters:
        - in: path
          name: deploymentId
          required: true
          schema:
            type: number
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolderInput'
        description: CreateFolderInput
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
          description: ''
      summary: Create a folder
      tags:
        - Folders
      x-mint:
        content: >-
          Create a new folder in a deployment's workspace.


          Provide a `name`, and optionally a `parentId` to nest the folder inside an existing one
          (omit it to create the folder at the workspace root). An optional `position` controls the
          folder's ordering among its siblings.


          Requires the **AI BI User** role (or higher). When `parentId` is set, the caller must
          additionally have **edit** or **manage** access to that parent folder.


          Folders can be nested up to a fixed maximum depth; exceeding it returns `400`.
  /api/v1/deployments/{deploymentId}/folders/{folderId}:
    delete:
      operationId: deleteFolder
      parameters:
        - in: path
          name: deploymentId
          required: true
          schema:
            type: number
        - in: path
          name: folderId
          required: true
          schema:
            type: number
      responses:
        '200':
          content:
            application/json: {}
          description: Successful response
      summary: Delete a folder
      tags:
        - Folders
      x-mint:
        content: >-
          Delete a folder from a deployment's workspace. Responds with `204 No Content` on success.


          The folder must be empty of sub-folders: if it still has child folders, the request is
          rejected with `400` — delete or move the sub-folders first.


          Content directly inside the folder (workbooks, dashboards, reports) is **not** deleted. It
          is detached and returned to the workspace root.


          Requires **manage** access to the folder. Returns `404` if the folder does not exist or
          belongs to a different deployment.
    put:
      operationId: updateFolder
      parameters:
        - in: path
          name: deploymentId
          required: true
          schema:
            type: number
        - in: path
          name: folderId
          required: true
          schema:
            type: number
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFolderInput'
        description: UpdateFolderInput
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
          description: ''
      summary: Update a folder
      tags:
        - Folders
      x-mint:
        content: >-
          Update a folder's metadata — its `name` and/or its `position` among its siblings. Both
          fields are optional; only the fields you send are changed.


          This endpoint does **not** move a folder to a different parent. To re-parent a folder, use
          `POST /workspace/move` with `type: FOLDER`.


          Requires **edit** access to the folder. Returns `404` if the folder does not exist or
          belongs to a different deployment.
  /api/v1/deployments/{deploymentId}/folders/{folderId}/ancestors:
    get:
      operationId: getFolderAncestors
      parameters:
        - in: path
          name: deploymentId
          required: true
          schema:
            type: number
        - in: path
          name: folderId
          required: true
          schema:
            type: number
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Folder'
                type: array
          description: ''
      summary: List folder ancestors
      tags:
        - Folders
      x-mint:
        content: >-
          Return the ancestor chain of a folder, ordered from the workspace root down to (and
          including) the folder itself.


          Use this to render a breadcrumb path for a nested folder. For example, for `Root / Sales /
          Q1` requested on the `Q1` folder, the response is `[Root, Sales, Q1]`.


          Requires visibility access to the target folder. Returns `404` if the folder does not
          exist or belongs to a different deployment.
  /api/v1/deployments/{deploymentId}/logs:
    get:
      operationId: logs
      parameters:
        - in: path
          name: deploymentId
          required: true
          schema:
            type: integer
        - in: query
          name: source
          schema:
            oneOf:
              - $ref: '#/components/schemas/DeploymentLogsQuerySource'
              - type: 'null'
        - in: query
          name: pod
          schema:
            oneOf:
              - type: string
              - type: 'null'
        - in: query
          name: container
          schema:
            oneOf:
              - $ref: '#/components/schemas/DeploymentLogsQueryContainer'
              - type: 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentLogsResponse'
          description: ''
      summary: >-
        Recent runtime logs (tail) for a deployment. With no `source`, reads both the production API
        / worker pods and the dev-mode worker, merged chronologically; scope with
        `?source=production` or `?source=dev`.
      tags:
        - Deployments
  /api/v1/deployments/{deploymentId}/notifications:
    get:
      operationId: getNotifications
      parameters:
        - in: path
          name: deploymentId
          required: true
          schema:
            type: integer
          description: Numeric id of the deployment that owns the notification.
        - in: query
          name: dashboardId
          required: false
          schema:
            oneOf:
              - minimum: 1
                type: integer
                description: >-
                  Optional filter: only return notifications for this numeric dashboard id. Provide
                  this OR dashboardPublicId, not both.
              - type: 'null'
            type: integer
            minimum: 1
          description: >-
            Optional filter: only return notifications for this numeric dashboard id. Provide this
            OR `dashboardPublicId`, not both.
        - in: query
          name: dashboardPublicId
          required: false
          schema:
            oneOf:
              - type: string
                description: >-
                  Optional filter: only return notifications for this dashboard public id. Provide
                  this OR dashboardId, not both.
              - type: 'null'
            type: string
          description: >-
            Optional filter: only return notifications for this dashboard public id. Provide this OR
            `dashboardId`, not both.
        - in: query
          name: recipientUserId
          required: false
          schema:
            oneOf:
              - minimum: 1
                type: integer
                description: >-
                  Optional filter: only return notifications received by this user, by user id.
                  Mutually exclusive with recipientEmail and the embed-user filter.
              - type: 'null'
            type: integer
            minimum: 1
          description: >-
            Optional filter: only return notifications received by this user, by user id. Mutually
            exclusive with `recipientEmail` and the embed-user filter.
        - in: query
          name: recipientEmail
          required: false
          schema:
            oneOf:
              - type: string
                description: >-
                  Optional filter: only return notifications received by this user, by email.
                  Mutually exclusive with recipientUserId and the embed-user filter.
              - type: 'null'
            type: string
          description: >-
            Optional filter: only return notifications received by this user, by email. Mutually
            exclusive with `recipientUserId` and the embed-user filter.
        - in: query
          name: recipientEmbedTenantName
          required: false
          schema:
            oneOf:
              - type: string
                description: >-
                  Optional filter: only return notifications received by this embed user. Required
                  together with recipientExternalId; mutually exclusive with the user filters.
              - type: 'null'
            type: string
          description: >-
            Optional filter: only return notifications received by this embed user. Required
            together with `recipientExternalId`; mutually exclusive with the user filters.
        - in: query
          name: recipientExternalId
          required: false
          schema:
            oneOf:
              - type: string
                description: >-
                  Optional filter: only return notifications received by this embed user. Required
                  together with recipientEmbedTenantName; mutually exclusive with the user filters.
              - type: 'null'
            type: string
          description: >-
            Optional filter: only return notifications received by this embed user. Required
            together with `recipientEmbedTenantName`; mutually exclusive with the user filters.
        - in: query
          name: first
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
          description: Page size for cursor pagination (default 100, max 200).
        - in: query
          name: after
          required: false
          schema:
            minimum: 1
            type: string
          description: Opaque cursor for the next page; pass the previous response's `pageInfo.endCursor`.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsListResponse'
          description: ''
      summary: List scheduled notifications
      tags:
        - Notifications
      x-mint:
        content: >-
          **🔒 Admin only.** Requires administrator privileges — the authenticated principal (API
          key, embed JWT, or any bearer token) must belong to a user with the admin role.


          Returns the deployment’s scheduled notifications (recurring dashboard runs), ordered by
          creation time (newest first) and cursor-paginated. Optionally filter to a single dashboard
          with either `dashboardId` (numeric) or `dashboardPublicId` (string), and/or to the
          notifications a single recipient receives — a user (`recipientUserId` or `recipientEmail`)
          or an embed user (`recipientEmbedTenantName` + `recipientExternalId`). At most one
          identifier per dashboard/recipient dimension. Each item describes the schedule only;
          recipients are managed through the `/recipients` sub-resource.
    post:
      operationId: createNotification
      parameters:
        - in: path
          name: deploymentId
          required: true
          schema:
            type: integer
          description: Numeric id of the deployment that owns the notification.
      requestBody:
        content:
          application/json:
            schema:
