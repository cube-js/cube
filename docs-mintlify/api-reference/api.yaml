      x-mint:
        content: >-
          Idempotent create-or-update ("upsert") of a report keyed by its portable `publicId` — the
          stable identity for managing dashboards as code (CI/CD pipelines re-applying the same
          definition against any environment).


          If a report with this `publicId` exists in the deployment, it is updated with the fields
          you send (same semantics as `PUT /reports/:reportId`); otherwise a new report is created
          with this `publicId`. Re-applying the same request is a no-op. The `publicId` must be a
          12-character alphanumeric id (`[0-9A-Za-z]`); mint one client-side when authoring the
          definition.


