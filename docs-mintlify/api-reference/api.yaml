        content: >-
          Create a full copy of a workbook, including its reports and its published dashboard, and
          return the new workbook.


          The clone is named "Copy of \{original name\}". All report references inside the dashboard
          (and the dashboard draft) are re-pointed at the copied reports, so the duplicate is fully
          self-contained and independent of the original. Per-user view history (last-viewed
          timestamps) is **not** carried over.


