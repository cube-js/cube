          body's `code` — handle them differently:


          - **No `code`** — the `publicId` already belongs to a report in a **different**
          deployment. Because `publicId` is unique across the account, it is rejected rather than
          silently updating across deployments (reported regardless of whether you have access to
          that report). This is **permanent**: retrying will not help; use a different `publicId`.

          - **`code: "upsert_branch_changed"`** — whether this request creates or updates is
          decided, and access-checked, before it is applied; another writer changed that in between
          (created or deleted the report with this `publicId`). The request was rejected rather than
          applied under the wrong permission check. This is **transient: retry the request**. It
          only happens when two writers target the same `publicId` concurrently, e.g. two pipeline
          runs applying the same bundle at once.

