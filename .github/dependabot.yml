version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/docs-mintlify"
      - "/packages/cubejs-playground/vizard"
      - "/packages/cubejs-playground/vizard/apps/*"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/examples"
    schedule:
      interval: "monthly"
    labels: [ ]
    ignore:
      - dependency-name: "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: [ "*" ]
