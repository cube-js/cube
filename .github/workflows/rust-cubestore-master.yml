name: Rust Master
on:
  push:
    paths:
      - '.github/workflows/rust-cubestore-master.yml'
      - 'rust/cubestore/**'
    branches:
      - master

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  debian:
    name: Debian Rust ${{ matrix.rust }}
    # 22.04 has gcc 11, new binutils (ld)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        rust: [nightly-2025-08-01]
    env:
      RUST: ${{ matrix.rust }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Maximize build space
        uses: ./.github/actions/maximize-build-space
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          # override: true # this is by default on
          rustflags: ""
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./rust/cubestore -> target
          shared-key: cubestore
          key: ubuntu-22.04
      - name: Run cargo fmt
        run: cargo fmt --check
        working-directory: rust/cubestore
      - name: Run cargo check
        # Re-using test profile to speedup builds
        run: cargo check --benches --profile test
        working-directory: rust/cubestore
      - name: Run cargo test
        env:
          CUBESTORE_AWS_ACCESS_KEY_ID: ${{ secrets.CUBESTORE_AWS_ACCESS_KEY_ID }}
          CUBESTORE_AWS_SECRET_ACCESS_KEY: ${{ secrets.CUBESTORE_AWS_SECRET_ACCESS_KEY }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          TEST_KSQL_USER: ${{ secrets.TEST_KSQL_USER }}
          TEST_KSQL_PASS: ${{ secrets.TEST_KSQL_PASS }}
          TEST_KSQL_URL: ${{ secrets.TEST_KSQL_URL }}
        run: cargo test -- --test-threads=1
        working-directory: rust/cubestore

  cubestore-docker-image-dev-prepare:
    name: Release Cube Store :dev image (prepare)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.prep.outputs.version }}
      created: ${{ steps.prep.outputs.created }}
    steps:
      - name: Prepare
        id: prep
        run: |
          VERSION="dev"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            VERSION="nightly"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ "$GITHUB_REF" == refs/heads/* ]]; then
            VERSION=$(echo "${GITHUB_REF#refs/heads/}" | sed -r 's#/+#-#g')
            if [ "${{ github.event.repository.default_branch }}" = "$VERSION" ]; then
              VERSION="edge"
            fi
          elif [[ "$GITHUB_REF" == refs/pull/* ]]; then
            VERSION="pr-${{ github.event.number }}"
          fi

          {
            echo "version=${VERSION}"
            echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

  cubestore-docker-image-dev:
    name: Release Cube Store :dev image
    runs-on: ${{ matrix.os }}
    needs: [cubestore-docker-image-dev-prepare]
    strategy:
      matrix:
        # Pushed by digest and merged into one multi-arch manifest by
        # cubestore-docker-image-dev-manifest.
        include:
          - os: ubuntu-24.04
            arch: amd64
            platforms: linux/amd64
            build-args: WITH_AVX2=1
          - os: ubuntu-24.04-arm
            arch: arm64
            platforms: linux/arm64
            build-args: WITH_AVX2=0
    timeout-minutes: 60
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Repo metadata
        id: repo
        uses: actions/github-script@v9
        with:
          script: |
            const repo = await github.rest.repos.get(context.repo)
            return repo.data
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Push to Docker Hub
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./rust
          file: ./rust/cubestore/Dockerfile
          platforms: ${{ matrix.platforms }}
          build-args: ${{ matrix.build-args }}
          outputs: type=image,name=cubejs/cubestore,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=cubestore-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=cubestore-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=${{ fromJson(steps.repo.outputs.result).name }}
            org.opencontainers.image.description=${{ fromJson(steps.repo.outputs.result).description }}
            org.opencontainers.image.url=${{ fromJson(steps.repo.outputs.result).html_url }}
            org.opencontainers.image.source=${{ fromJson(steps.repo.outputs.result).clone_url }}
            org.opencontainers.image.version=${{ needs.cubestore-docker-image-dev-prepare.outputs.version }}
            org.opencontainers.image.created=${{ needs.cubestore-docker-image-dev-prepare.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=${{ fromJson(steps.repo.outputs.result).license.spdx_id }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: cubestore-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  cubestore-docker-image-dev-manifest:
    name: Release Cube Store :dev image (multi-arch manifest)
    runs-on: ubuntu-24.04
    needs: [cubestore-docker-image-dev-prepare, cubestore-docker-image-dev]
    timeout-minutes: 15
    strategy:
      matrix:
        # -arm64v8 tags used to be a separate arm64-only image, keep publishing
        # them as aliases of the same multi-arch manifest.
        include:
          - postfix: ""
          - postfix: "-arm64v8"
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: cubestore-digests-*
          merge-multiple: true
      - name: Prepare
        id: prep
        run: |
          DOCKER_IMAGE=cubejs/cubestore
          VERSION="${{ needs.cubestore-docker-image-dev-prepare.outputs.version }}"

          TAGS="${DOCKER_IMAGE}:${VERSION}${{ matrix.postfix }}"

          if [[ "$VERSION" =~ ^v[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            MINOR="${VERSION%.*}"
            MAJOR="${MINOR%.*}"
            TAGS="$TAGS,${DOCKER_IMAGE}:${MINOR}${{ matrix.postfix }},${DOCKER_IMAGE}:${MAJOR}${{ matrix.postfix }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAGS="$TAGS,${DOCKER_IMAGE}:build-1${GITHUB_RUN_NUMBER}${{ matrix.postfix }}"
          fi

          {
            echo "image=${DOCKER_IMAGE}"
            echo "version=${VERSION}"
            echo "tags=${TAGS}"
          } >> "$GITHUB_OUTPUT"
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.prep.outputs.image }}
          TAGS: ${{ steps.prep.outputs.tags }}
        run: |
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $(printf -- '-t %s ' ${TAGS//,/ }) $(printf "${IMAGE}@sha256:%s " *)
      - name: Inspect image
        run: docker buildx imagetools inspect ${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.version }}${{ matrix.postfix }}
      - name: Update repo description
        if: matrix.postfix == ''
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: cubejs/cubestore
          readme-filepath: ./rust/cubestore/README.md

  cubestore:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTFLAGS: '-Ctarget-feature=+crt-static'
      OPENSSL_STATIC: 1
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-apple-darwin
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            executable_name: cubestored.exe
            strip: true
            # cubestored.exe: CantPackException: superfluous data between sections
            compress: false
            # Please use minimal possible version of macOS, because it produces constraint on libstdc++
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable_name: cubestored
            # upx has been disabled because it is crashing for macOS Ventura or above! It was disabled on 2024-09-05.
            strip: false
            compress: false
          - os: macos-14
            target: aarch64-apple-darwin
            executable_name: cubestored
            # upx has been disabled because it is crashing for macOS Ventura or above! It was disabled on 2024-09-05.
            strip: false
            compress: false
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Disable rustup update (issue workaround for Windows)
        run: rustup set auto-self-update disable
        if: contains(runner.os, 'windows')
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./rust/cubestore -> target
          prefix-key: v0-rust-cubestore-cross
          key: target-${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: ${{ startsWith(matrix.os, 'windows') }}
      - name: Install OpenSSL for Windows
        if: ${{ startsWith(matrix.os, 'windows') }}
        run: vcpkg integrate install; vcpkg install openssl:x64-windows
      - name: Instal LLVM for Windows
        if: ${{ startsWith(matrix.os, 'windows') }}
        run: choco install -y --force llvm --version 22.1.0
      - name: Set Env Variables for Windows
        if: ${{ startsWith(matrix.os, 'windows') }}
        shell: bash
        run: |
          {
            echo "OPENSSL_DIR=C:/vcpkg/packages/openssl_x64-windows"
            # This paths are required to work with static linking
            echo "OPENSSL_LIB_DIR=C:/vcpkg/packages/openssl_x64-windows/lib"
            echo "OPENSSL_INCLUDE_DIR=C:/vcpkg/packages/openssl_x64-windows/include"
            printf '%s\n' 'LIBCLANG_PATH=C:\Program Files\LLVM\bin'
          } >> "$GITHUB_ENV"
      - name: Build with Cargo
        run: |
          cd rust/cubestore && cargo build --release --target=${{ matrix.target }} -p cubestore
      - name: Compress binaries
        uses: svenstaro/upx-action@v3
        if: ${{ matrix.compress }}
        with:
          files: rust/cubestore/target/${{ matrix.target }}/release/${{ matrix.executable_name }}
          args: --lzma
          strip: ${{ matrix.strip }}
      - name: Create folder for archive
        run: |
          mkdir cubestore-archive
          mkdir cubestore-archive/bin
      - name: Copy/paste OpenSSL to Archive (hotfix for Windows)
        if: ${{ startsWith(matrix.os, 'windows') }}
        run: cp C:/vcpkg/packages/openssl_x64-windows/bin/*.dll cubestore-archive/bin
      - name: Create archive for release
        run: |
          mv rust/cubestore/target/${{ matrix.target }}/release/${{ matrix.executable_name }} cubestore-archive/bin/${{ matrix.executable_name }}
          cd cubestore-archive
          tar -cvzf cubestored-${{ matrix.target }}.tar.gz ./*
      - uses: actions/upload-artifact@v7
        with:
          path: cubestore-archive/cubestored-${{ matrix.target }}.tar.gz
          name: cubestored-${{ matrix.target }}.tar.gz
          retention-days: 1

  cubestore_linux:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      OPENSSL_STATIC: 1
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
        include:
          # Please use minimal possible version of ubuntu, because it produces constraint on glibc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            image: cubejs/rust-cross:x86_64-unknown-linux-gnu-08092026
            executable_name: cubestored
            strip: true
            compress: false
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            image: cubejs/rust-cross:x86_64-unknown-linux-musl-08092026
            executable_name: cubestored
            strip: true
            # cubestored: CantPackException: bad DT_HASH nbucket=0x344  len=0x1890
            compress: false
          - os: ubuntu-24.04-arm
            image: cubejs/rust-builder:bullseye-llvm-18
            target: aarch64-unknown-linux-gnu
            executable_name: cubestored
            # Unable to recognise the format of the input file `rust/cubestore/target/aarch64-unknown-linux-gnu/release/cubestored'
            strip: false
            # UPX is broken, issue https://github.com/cube-js/cube/issues/4474
            compress: false
      fail-fast: false
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2025-08-01
          target: ${{ matrix.target }}
          # override: true # this is by default on
          rustflags: ""
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./rust/cubestore -> target
          prefix-key: v1-rust-cubestore-cross
          key: target-${{ matrix.target }}
      - name: Build with Cargo
        run: |
          # jemalloc bakes the page size in at build time. This runner has 4 KiB
          # pages, but arm64 hosts can use up to 64 KiB (Raspberry Pi, Ubuntu
          # arm64-largemem, Asahi), so build for the largest one there.
          # TODO: drop once we are on jemalloc 5.3.1+, where this is the default.
          case "${{ matrix.target }}" in
            aarch64-*) export JEMALLOC_SYS_WITH_LG_PAGE=16 ;;
          esac
          cd rust/cubestore && cargo build --release --target=${{ matrix.target }} -p cubestore
      - name: Compress binaries
        uses: svenstaro/upx-action@v3
        if: ${{ matrix.compress }}
        with:
          files: rust/cubestore/target/${{ matrix.target }}/release/${{ matrix.executable_name }}
          args: --lzma
          strip: ${{ matrix.strip }}
      - name: Create folder for archive
        run: |
          mkdir cubestore-archive
          mkdir cubestore-archive/bin
      - name: Create archive for release
        run: |
          mv rust/cubestore/target/${{ matrix.target }}/release/${{ matrix.executable_name }} cubestore-archive/bin/${{ matrix.executable_name }}
          cd cubestore-archive
          tar -cvzf cubestored-${{ matrix.target }}.tar.gz ./*
      - uses: actions/upload-artifact@v7
        with:
          path: cubestore-archive/cubestored-${{ matrix.target }}.tar.gz
          name: cubestored-${{ matrix.target }}.tar.gz
          retention-days: 1
