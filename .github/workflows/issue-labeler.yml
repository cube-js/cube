name: Issue Labeler
on:
  issues:
    types: [labeled]

jobs:
  main:
    name: Process Label Action
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Process Label Action
        # Reads .github/label-actions.yml over the API, so no checkout needed
        uses: dessant/label-actions@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
