name: Lint CI Workflows

on:
  push:
    branches: [ master ]
    paths:
      - .github/workflows/**
  pull_request:
    paths:
      - .github/workflows/**

permissions:
  contents: read

jobs:
  lint:
    name: Lint workflows yaml
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # rhysd/actionlint is unmaintained and misses newer syntax such as `concurrency.queue`,
      # so we use an active fork: https://github.com/rhysd/actionlint/issues/719
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl --fail --silent --show-error --location https://raw.githubusercontent.com/kjanat/actionlint/v1.17.0/scripts/download-actionlint.bash) 1.17.0
        shell: bash
      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash
