name: Lint CI Workflows

on:
  push:
    branches: [ master ]
    paths:
      - .github/workflows/**
  pull_request:
    paths:
      - .github/workflows/**

permissions:
  contents: read

jobs:
  lint:
    name: Lint workflows yaml
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # rhysd/actionlint is unmaintained and misses newer syntax such as `concurrency.queue`,
      # so we use an active fork: https://github.com/rhysd/actionlint/issues/719
      - name: Check workflow files
        uses: kjanat/actionlint@v1.17.0
